publish:
  - "github"
productName: "Awakened PoE Trade Simplified Chinese"
npmRebuild: false
toolsets:
  appimage: 1.0.3
artifactBuildCompleted: "build/apprun-patch.test.mjs"
files:
  - "package.json"
  - from: "dist"
    to: "."
    filter: ["main.js", "vision.js"]
  - from: "../renderer/dist"
    to: "."
extraMetadata:
  main: "main.js"
nsis:
  artifactName: "Awakened PoE Trade CN Setup ${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: "Awakened PoE Trade CN ${version}.${ext}"
win:
  target:
  - "nsis"
  - "portable"
linux:
  target:
  - "AppImage"
mac:
  target:
  - target: "dmg"
    arch:
    - "universal"
  identity: null
  x64ArchFiles: "*"
